[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Control referrer info
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Legacy XSS filter (IE/old Edge)
    X-XSS-Protection = "1; mode=block"
    # Disable browser features this app never uses
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Content Security Policy:
    # - default-src self only
    # - scripts: self + inline (React needs inline for hydration) + blob: (for generated file downloads)
    # - styles: self + unsafe-inline (CSS-in-JS via buildStyles()) + Google Fonts
    # - fonts: Google Fonts CDN
    # - img: self + data: (base64 logo) + blob: (generated files)
    # - connect: self only (no external API calls)
    # - frame/object/base: all denied
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Control referrer info
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Old browser XSS filter: switched off, as current guidance recommends (the CSP below does the job)
    X-XSS-Protection = "0"
    # Disable browser features this app never uses
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Content Security Policy (what the site may load):
    # - everything from our own site only ('self') - no Google Fonts or other outside services
    # - scripts/styles: self + inline (React and the generated worksheet previews need inline)
    # - fonts: self + data: (worksheet previews embed their fonts so files work offline)
    # - img: self + data: + blob: (downloads and previews)
    # - connect/form-action: self only (Netlify Forms posts to our own site)
    # - frames/objects: none (the in-app preview uses srcdoc, which is still allowed); base: self
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

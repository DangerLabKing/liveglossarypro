<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Glossary Pro — free vocabulary worksheets from your word list</title>
    <meta name="description" content="Type or paste your vocabulary list and print flash cards, bingo, word searches, crosswords, quizzes and Frayer models in seconds. Free for K–12 teachers. No sign-up — your list never leaves your computer." />
    <meta name="theme-color" content="#1A1A1A" />
    <meta property="og:title" content="Live Glossary Pro — Type your word list. Print the worksheets." />
    <meta property="og:description" content="Free vocabulary worksheets for K–12 teachers: flash cards, bingo, word search, crossword, quiz, Frayer model and more." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Hidden copies of the site's forms. Netlify reads these when it builds the
      site so it knows the forms exist (the real forms are drawn by React).
      Field names here must match src/components/Forms.jsx.
    -->
    <form name="request-list" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="grade" /><input name="unit" /><textarea name="words"></textarea><input name="email" /><input name="monthly" />
    </form>
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="email" /><input name="source" />
    </form>
  </body>
</html>
